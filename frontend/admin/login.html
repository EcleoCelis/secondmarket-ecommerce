<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Sign In | SecondMarket</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/auth.css">
</head>
<body class="auth-page admin-auth-page">
    <main class="auth-shell" aria-labelledby="admin-login-title">
        <a class="auth-brand" href="/admin/login.html">
            <span class="auth-brand-mark" aria-hidden="true"></span>
            SecondMarket Admin
        </a>

        <section class="auth-panel">
            <h1 id="admin-login-title">Admin Seller Sign In</h1>
            <p style="text-align:center; margin:0 0 1.5rem;">Access inventory, orders, fulfillment, and seller operations.</p>

            <div data-auth-message class="auth-message" role="status" aria-live="polite"></div>

            <form data-auth-form="login" data-auth-required-role="admin" data-auth-success-url="/admin" class="auth-grid" novalidate>
                <div class="auth-field">
                    <label for="admin-login-email">Admin Email Address</label>
                    <input id="admin-login-email" name="email" type="email" required autocomplete="email" class="form-input">
                </div>
                <div class="auth-field">
                    <label for="admin-login-password">Password</label>
                    <input id="admin-login-password" name="password" type="password" required autocomplete="current-password" class="form-input">
                </div>
                <button type="submit" class="btn-primary">Sign In To Admin</button>
            </form>

            <div class="auth-page-links">
                <a class="btn-outline" href="/login.html">Buyer Sign In</a>
                <a class="btn-outline" href="/">Back To Storefront</a>
            </div>
        </section>
    </main>

    <script src="/static/js/auth-client.js"></script>
    <script src="/static/js/auth-page.js"></script>
</body>
</html>
